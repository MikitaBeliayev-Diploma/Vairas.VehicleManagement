name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Vairas.VehicleManagement.slnx
      - run: dotnet build Vairas.VehicleManagement.slnx -c Release --no-restore
      # PostgreSQL tests start a disposable server with Testcontainers (Docker is available on the runner).
      - name: Tests with coverage
        run: dotnet test Vairas.VehicleManagement.slnx -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory coverage --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            coverage/**/coverage.cobertura.xml
            **/TestResults/*.trx
