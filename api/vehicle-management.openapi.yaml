components:
  schemas:
    CreateVehicleRequest:
      required:
        - branchId
        - registrationCountryCode
        - registrationNumber
        - manufacturer
        - model
        - manufactureYear
        - transmission
        - categories
      type: object
      properties:
        branchId:
          type: string
          format: uuid
        registrationCountryCode:
          type: string
        registrationNumber:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        manufactureYear:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int16
        transmission:
          $ref: '#/components/schemas/Transmission'
        categories:
          type: array
          items:
            type: string
      description: Create an inactive vehicle with an explicit nonempty category set.
    MutationResponse:
      required:
        - operationId
        - resource
        - replayed
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/VehicleResponse'
        replayed:
          type: boolean
      description: 'Exact saved command result, including whether this was an authorized retry.'
    ReplaceCategoriesRequest:
      required:
        - expectedRevision
        - categories
      type: object
      properties:
        expectedRevision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        categories:
          type: array
          items:
            type: string
      description: Replace supported categories while the vehicle is safely outside operation.
    ReplaceTeacherAssignmentsRequest:
      required:
        - expectedRevision
        - teacherIds
      type: object
      properties:
        expectedRevision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        teacherIds:
          type: array
          items:
            type: string
            format: uuid
      description: Replace teacher assignments; the server resolves exact current memberships.
    SagaStatus:
      enum:
        - Pending
        - Blocking
        - SchedulingBlocked
        - ApplyingVehicleState
        - ReleasingBlock
        - Completed
        - Rejected
        - NeedsRecovery
    SchedulingVehicleSnapshot:
      required:
        - vehicleId
        - schoolId
        - teacherId
        - branchId
        - category
        - revision
        - eligible
        - gateSupported
        - validUntil
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        category:
          type: string
        revision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        eligible:
          type: boolean
        gateSupported:
          type: boolean
        validUntil:
          type: string
          format: date-time
      description: Exact short-lived source snapshot; reservation decisions remain in Scheduling.
    StateChangeRequest:
      required:
        - operationType
        - expectedVehicleRevision
        - reason
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/StateChangeType'
        expectedVehicleRevision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        reason:
          type: string
      description: Request a durable planned status change with optimistic concurrency.
    StateChangeResponse:
      required:
        - operationId
        - vehicleId
        - operationType
        - status
        - blockId
        - resultVehicleStatus
        - errorCode
        - createdAt
        - updatedAt
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        operationType:
          $ref: '#/components/schemas/StateChangeType'
        status:
          $ref: '#/components/schemas/SagaStatus'
        blockId:
          type:
            - 'null'
            - string
          format: uuid
        resultVehicleStatus:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/VehicleStatus'
        errorCode:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: 'Persisted status of one state-change Saga; 202 means processing, not completion.'
    StateChangeType:
      enum:
        - Deactivate
        - Reactivate
    TeacherAssignmentResponse:
      required:
        - teacherId
        - schoolMembershipId
        - assignedAt
      type: object
      properties:
        teacherId:
          type: string
          format: uuid
        schoolMembershipId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
      description: One current vehicle teacher assignment and its exact authority basis.
    Transmission:
      enum:
        - Manual
        - Automatic
    UpdateVehicleRequest:
      required:
        - expectedRevision
        - registrationCountryCode
        - registrationNumber
        - manufacturer
        - model
        - manufactureYear
        - transmission
      type: object
      properties:
        expectedRevision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        registrationCountryCode:
          type: string
        registrationNumber:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        manufactureYear:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int16
        transmission:
          $ref: '#/components/schemas/Transmission'
      description: 'Update descriptive fields; school, branch and operational status cannot be patched.'
    VehicleEligibilityResponse:
      required:
        - vehicleId
        - eligible
        - vehicleStatus
        - vehicleVersion
        - reasons
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        eligible:
          type: boolean
        vehicleStatus:
          $ref: '#/components/schemas/VehicleStatus'
        vehicleVersion:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        reasons:
          type: array
          items:
            type: string
      description: Current operational preflight; never a reservation or a reusable admission permit.
    VehicleListResponse:
      required:
        - items
        - nextCursor
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'
        nextCursor:
          type:
            - 'null'
            - string
          format: uuid
      description: Bounded vehicle page with an exclusive UUID cursor.
    VehicleOwnershipSnapshot:
      required:
        - vehicleId
        - schoolId
        - revision
        - gateSupported
        - validUntil
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        revision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        gateSupported:
          type: boolean
        validUntil:
          type: string
          format: date-time
      description: Minimal verified ownership for the Scheduling vehicle gate.
    VehicleResponse:
      required:
        - vehicleId
        - schoolId
        - branchId
        - registrationCountryCode
        - registrationNumber
        - manufacturer
        - model
        - manufactureYear
        - transmission
        - status
        - revision
        - categories
        - teacherAssignments
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        registrationCountryCode:
          type: string
        registrationNumber:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        manufactureYear:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int16
        transmission:
          $ref: '#/components/schemas/Transmission'
        status:
          $ref: '#/components/schemas/VehicleStatus'
        revision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        categories:
          type: array
          items:
            type: string
        teacherAssignments:
          type: array
          items:
            $ref: '#/components/schemas/TeacherAssignmentResponse'
      description: Authorized vehicle representation; no scheduling reservations are owned here.
    VehicleStatus:
      enum:
        - Active
        - Inactive
        - UnderMaintenance
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      description: vehicles.eligibility.read scope and configured workload allowlist.
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: InternalVehicles
  - name: VehicleOperations
  - name: Vehicles