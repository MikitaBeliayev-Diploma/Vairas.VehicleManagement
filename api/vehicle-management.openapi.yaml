          schema:
            type: string
            format: uuid
        - name: teacherId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SchedulingVehicleSnapshot'
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingVehicleSnapshot'
            text/json:
